<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Estructura base -->
  <path d="M 30 195 Q 150 185 270 195" fill="none" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round" />
  <rect x="65" y="35" width="14" height="160" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="5" />
  <rect x="221" y="35" width="14" height="160" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="5" />
  <rect x="50" y="25" width="200" height="14" rx="7" fill="#eab55e" stroke="#1e1e1e" stroke-width="5" />
  <line x1="115" y1="39" x2="115" y2="155" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round" />
  <line x1="185" y1="39" x2="185" y2="155" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round" />

  <!-- Cuerpo -->
  <rect x="131" y="103" width="38" height="49" rx="18" fill="#eab55e" stroke="#1e1e1e" stroke-width="5" />
  <ellipse cx="150" cy="128" rx="11" ry="15" fill="#ffffff" stroke="#1e1e1e" stroke-width="3.5" />

  <!-- Brazos -->
  <path d="M 134 112 Q 118 112 115 106" fill="none" stroke="#1e1e1e" stroke-width="11" stroke-linecap="round" />
  <path d="M 134 112 Q 118 112 115 106" fill="none" stroke="#eab55e" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="115" cy="106" r="6" fill="#eab55e" stroke="#1e1e1e" stroke-width="4" />

  <path d="M 166 112 Q 182 112 185 106" fill="none" stroke="#1e1e1e" stroke-width="11" stroke-linecap="round" />
  <path d="M 166 112 Q 182 112 185 106" fill="none" stroke="#eab55e" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="185" cy="106" r="6" fill="#eab55e" stroke="#1e1e1e" stroke-width="4" />

  <!-- Asiento -->
  <rect x="103" y="152" width="94" height="12" rx="6" fill="#eab55e" stroke="#1e1e1e" stroke-width="5" />

  <!-- Ambas piernas colgando -->
  <g>
    <rect x="132" y="156" width="13" height="20" rx="6" fill="#eab55e" stroke="#1e1e1e" stroke-width="4.5" />
    <ellipse cx="138.5" cy="176" rx="8" ry="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="4" />

    <rect x="155" y="156" width="13" height="20" rx="6" fill="#eab55e" stroke="#1e1e1e" stroke-width="4.5" />
    <ellipse cx="161.5" cy="176" rx="8" ry="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="4" />
  </g>

  <!-- Cabeza completa con gorra -->
  <g>
    <circle cx="127" cy="64" r="10" fill="#eab55e" stroke="#1e1e1e" stroke-width="4.5" />
    <circle cx="173" cy="64" r="10" fill="#eab55e" stroke="#1e1e1e" stroke-width="4.5" />
    <circle cx="150" cy="82" r="24" fill="#eab55e" stroke="#1e1e1e" stroke-width="5" />
    
    <!-- Gorra del personaje -->
    <path d="M 136 62 A 15 12 0 0 1 164 62 Z" fill="#ffffff" stroke="#1e1e1e" stroke-width="4" />
    <path d="M 152 62 L 173 60" stroke="#1e1e1e" stroke-width="4.5" stroke-linecap="round" />

    <!-- Hocico y sonrisa -->
    <ellipse cx="150" cy="88" rx="10" ry="7.5" fill="#ffffff" stroke="#1e1e1e" stroke-width="3.5" />
    <circle cx="150" cy="85.5" r="2.5" fill="#1e1e1e" />
    <path d="M 145 90 Q 150 95 155 90" fill="none" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Ojos felices -->
    <path d="M 138 78 Q 141 74 144 78" fill="none" stroke="#1e1e1e" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 156 78 Q 159 74 162 78" fill="none" stroke="#1e1e1e" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <!-- Estrellitas alrededor indicando personaje completado -->
  <path d="M 95 65 L 98 72 L 105 74 L 98 76 L 95 83 L 92 76 L 85 74 L 92 72 Z" fill="#eab55e" stroke="#1e1e1e" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M 205 65 L 208 72 L 215 74 L 208 76 L 205 83 L 202 76 L 195 74 L 202 72 Z" fill="#eab55e" stroke="#1e1e1e" stroke-width="2.5" stroke-linejoin="round" />
