<header class="page-head">
  <a class="round-btn" routerLink="/games" [attr.aria-label]="'viaje.volver' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </a>
  <div class="page-head__text">
    <h1 class="page-head__title">{{ 'app.juegoMesa' | translate }}</h1>
  </div>
  <span class="badge">
    <svg class="badge__art" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="200" height="260" fill="#5E7B4B"/>
      <g transform="translate(100 116) scale(.85) translate(-100 -116)">
        <rect x="46" y="76" width="108" height="108" rx="20" fill="#FFFCF7"/>
        <circle cx="76" cy="106" r="9" fill="#12313B"/>
        <circle cx="124" cy="106" r="9" fill="#C8643C"/>
        <circle cx="100" cy="130" r="9" fill="#E3A93C"/>
        <circle cx="76" cy="154" r="9" fill="#1F5F73"/>
        <circle cx="124" cy="154" r="9" fill="#12313B"/>
      </g>
    </svg>
  </span>
</header>

<section class="setup">
  <div class="setup__row">
    <div class="field">
      <label class="field__label" for="selectorJuego">{{ 'app.selecJuegoMesa' | translate }}</label>
      <select id="selectorJuego" class="field__input" (change)="seleccionarJuego($event)">
        <option value="" disabled selected>{{ 'app.selecJuegoMesa' | translate }}</option>
        <option *ngFor="let juego of listaJuegos" [value]="juego.nombre">{{ juego.nombre }}</option>
      </select>
    </div>

    <div class="field">
      <label class="field__label" for="numDados">{{ 'app.numDados' | translate }}</label>
      <select id="numDados" class="field__input" [(ngModel)]="numDados" name="numDados">
        <option value="1">1 {{ 'app.dado' | translate }}</option>
        <option value="2">2 {{ 'app.dados' | translate }}</option>
      </select>
    </div>
  </div>

  <div class="players-meta" *ngIf="juegoSeleccionado">
    <span>{{ 'app.numJugadores' | translate }}:</span>
    <strong>{{ juegoSeleccionado.numJugadores }}</strong>
  </div>

  <div class="dice-actions">
    <button type="button" class="btn" (click)="lanzarDados()">{{ 'app.lanzarDados' | translate }}</button>
  </div>
</section>

<section class="dice-stage" *ngIf="(lanzandoDados | async) === true || ((lanzandoDados | async) === false && resultadoDados !== null)">
  <ng-container *ngIf="(lanzandoDados | async) === true">
    <img *ngIf="numDados == 2" class="dice-anim" src="assets/images/games/2dados.gif" alt="">
    <img *ngIf="numDados == 1" class="dice-anim" src="assets/images/games/1dado.gif" alt="">
  </ng-container>

  <div *ngIf="(lanzandoDados | async) === false && resultadoDados !== null" class="dadosRes">
    <img [src]="'assets/images/games/dado' + resultadoDados[0] + '.jpg'" alt="" class="resultDados">
    <img *ngIf="resultadoDados[1]" [src]="'assets/images/games/dado' + resultadoDados[1] + '.jpg'" alt="" class="resultDados">
  </div>
</section>

<section class="board-card" *ngIf="juegoSeleccionado?.rutaImagen">
  <img class="tablero" [src]="juegoSeleccionado?.rutaImagen" alt="">
</section>
