<header class="page-head">
  <a class="round-btn" routerLink="/games" [attr.aria-label]="'viaje.volver' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </a>
  <div class="page-head__text">
    <h1 class="page-head__title">{{ 'app.memory' | translate }}</h1>
  </div>
  <span class="badge"><svg class="badge__art" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="260" fill="#B4532A"/><g transform="translate(100 116) scale(.85) translate(-100 -116)"><rect x="46" y="76" width="56" height="76" rx="8" fill="#FFFCF7" transform="rotate(-10 74 114)"/><circle cx="74" cy="114" r="12" fill="#C8643C"/><rect x="98" y="76" width="56" height="76" rx="8" fill="#12313B" transform="rotate(8 126 114)"/><text x="126" y="132" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="700" fill="#E3A93C" transform="rotate(8 126 114)">?</text></g></svg></span>
</header>

<!-- Ajustes de la partida -->
<section class="setup">
  <div class="setup__row">
    <label class="field">
      <span class="field__label">{{ 'app.dificultad' | translate }}</span>
      <select class="field__input" id="difficulty" [(ngModel)]="difficulty" (change)="onDifficultyChange()">
        <option value="facil">{{ 'app.facil' | translate }}</option>
        <option value="medio">{{ 'app.medio' | translate }}</option>
        <option value="dificil">{{ 'app.dificil' | translate }}</option>
        <option value="loco">{{ 'app.deLocos' | translate }}</option>
      </select>
    </label>

    <label class="field">
      <span class="field__label">{{ 'app.tipoFotos' | translate }}</span>
      <select class="field__input" id="imagesType" [(ngModel)]="fotosJuegoSeleccionado" (change)="onSelectImagesGameChange()">
        <option *ngFor="let viaje of viajesConFotos" [value]="viaje.id">{{ viaje.destino }} ({{ viaje.anyo }})</option>
      </select>
    </label>
  </div>

  <!-- Jugadores -->
  <div class="field">
    <span class="field__label">{{ 'app.jugadores' | translate }}</span>
    <div class="picks">
      <button *ngFor="let jugador of servicioJugadores.viajerosLista" type="button" class="pick"
              [class.is-on]="isPlayerSelected(jugador)" [attr.aria-pressed]="isPlayerSelected(jugador)"
              (click)="togglePlayerSelection(jugador)">
        <img class="pick__img" [src]="jugador.fotoPerfil" [alt]="" loading="lazy">
        <span>{{ jugador.nombreCorto }}</span>
      </button>
    </div>
  </div>
</section>

<!-- Marcador: quien tiene el turno y sus puntos -->
<section class="players" *ngIf="jugadoresSeleccionados.length > 0">
  <button *ngFor="let jugador of jugadoresSeleccionados" type="button" class="player"
          [class.is-turn]="jugador.nombreCorto === selectedPlayer" (click)="seleccionarJugador(jugador.nombreCorto)">
    <img class="player__img" [src]="jugador.fotoPerfil" [alt]="jugador.nombreCorto">
    <span class="player__name">{{ jugador.nombreCorto }}</span>
    <span class="player__score" [ngSwitch]="jugador.nombreCorto">
      <ng-container *ngSwitchCase="'Marina'">{{ marinaScore / 2 }} puntos</ng-container>
      <ng-container *ngSwitchCase="'Mateu'">{{ mateuScore / 2 }} puntos</ng-container>
      <ng-container *ngSwitchCase="'Alba'">{{ albaScore / 2 }} puntos</ng-container>
      <ng-container *ngSwitchCase="'Albert'">{{ albertScore / 2 }} puntos</ng-container>
    </span>
  </button>
</section>

<div class="start">
  <button type="button" class="btn start__btn" (click)="startGame()">{{ 'app.startGame' | translate }}</button>
  <p class="notice" *ngIf="(jugadorInicialNoSeleccionado | async) === true" role="alert">{{ 'app.selectPlayer' | translate }}</p>
</div>

<!-- Tablero -->
<div *ngIf="(inicioDelJuego | async) === true" class="board">
  <div class="mcard" *ngFor="let card of cards" role="button" tabindex="0"
       [class.is-flipped]="card.isFlipped" [class.is-matched]="card.isMatched"
       (click)="flipCard(card)" (keydown.enter)="flipCard(card)" (keydown.space)="flipCard(card); $event.preventDefault()">
    <div class="mcard__inner">
      <div class="mcard__face mcard__front" aria-hidden="true"></div>
      <div class="mcard__face mcard__back">
        <img class="mcard__img" [src]="card.image" alt="">
        <span class="mcard__player" *ngIf="card.player">{{ card.player }}</span>
      </div>
    </div>
  </div>
</div>

<!-- Fin de la partida -->
<div *ngIf="(finDelJuego | async) === true" class="win" role="dialog" aria-modal="true">
  <div class="win__card">
    <svg class="ic win__trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a2 2 0 0 0 0 4c1 0 2.5 0 3.5-.5M16 6h3a2 2 0 0 1 0 4c-1 0-2.5 0-3.5-.5M12 13v4M8 20h8M10 17h4v3h-4z"/></svg>
    <span class="win__label">{{ 'app.ganador' | translate }}</span>
    <h2 class="win__title">{{ winnerPlayer }}</h2>
    <button type="button" class="btn" (click)="restartGame()">{{ 'app.restart' | translate }}</button>
  </div>
</div>
