<br>
<h2 class="titulo">
    <img src="assets/icons/ninos.png" alt="" class="iconosImgNinos animated rollIn">
   {{ 'app.dibujosTitulo' | translate }}
</h2>
<h3 class="subTitulo">
    <img src="assets/icons/escribiendo.png" alt="" class="iconosImgFav animated rollIn">
   {{ 'app.dibujosSubtitulo1' | translate }}
</h3>
<h4 class="subTitulo">
  <img src="assets/icons/dibujo.png" alt="" class="iconosImgFav animated rollIn">
    {{ 'app.dibujosSubtitulo2' | translate }}
</h4>
<br>
<div class="divRight">
  <img src="assets/icons/flechaAtras.png" class="animated fadeIn iconoFlecha" routerLink="/principal"><a routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
</div>

<!-- Para autenticarse en la aplicación -->
<div *ngIf="authenticationService.isLoggedIn() === false">
  <br><br><br>
  <app-login></app-login>
  <br>
</div>


<div *ngIf="authenticationService.isLoggedIn()">
  <ng-container *ngIf="vista$ | async as vista; else cargando">
    <br>
    <br>
    <app-buscador [placeholder]="'app.dibujosFiltrado' | translate" (buscar)="buscar($event)"></app-buscador>
    <div *ngIf="vista.dibujos.length > maxSizeDisplay" class="paginacion">
      <pagination-controls class="my-pagination" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]=maxSizeDisplay (pageChange)="p = $event"></pagination-controls>
    </div>
    <div *ngFor="let dibujo of vista.dibujos | paginate: { itemsPerPage: pageSize, currentPage: p }; let i = index" class="bloqueFrase animated zoomInDown">
      <div class="gallery">
        <a href="#" (click)="abierto = posicion(i); $event.preventDefault()">
          <img [src]="'assets/images/' + dibujo.src" loading="lazy" alt="" width="600" height="400" class="responsive">
          <figcaption class="textoFoto"><b>{{dibujo.persona}} ({{dibujo.anyo}})</b>: {{ dibujo.edad }} {{'app.edad' | translate}} - {{ dibujo.detalle | l10n }} </figcaption>
        </a>
      </div>
    </div>
    <div class="centerText">
      <span *ngIf="vista.dibujos.length == 0"> {{ 'app.sinResultados' | translate}}</span>
    </div>
    <div *ngIf="vista.dibujos.length > maxSizeDisplay" class="paginacion">
      <pagination-controls class="my-pagination" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]=maxSizeDisplay (pageChange)="p = $event"></pagination-controls>
    </div>
    <app-lightbox *ngIf="abierto !== null" [fotos]="vista.fotos" [indice]="abierto" (cerrar)="abierto = null"></app-lightbox>
  </ng-container>
  <ng-template #cargando>
    <div class="spinner-container">
      <div class="spinner"></div>
      <span> &nbsp; {{ 'app.cargando' | translate}}</span>
    </div>
  </ng-template>
</div> <!-- de la autenticacion -->
<br>
<br>
<div class="divRight">
  <img src="assets/icons/flechaAtras.png" class="animated fadeIn iconoFlecha" routerLink="/principal"><a routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
</div>
