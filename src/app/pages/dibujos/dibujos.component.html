<div class="fav-gallery-wrapper">

  <!-- Cabecera estilo Banner Editorial -->
  <header class="fav-hero-header">
    <div class="hero-content">
      <h2 class="titulo animated fadeInDown">
        <img src="assets/icons/ninos.png" alt="" class="iconosImgNinos animated rollIn">
        <span>{{ 'app.dibujosTitulo' | translate }}</span>
      </h2>
      <div class="subtitulos-group animated fadeIn">
        <h3 class="subTitulo">
          <img src="assets/icons/escribiendo.png" alt="" class="iconosImgFav animated rollIn">
          <span>{{ 'app.dibujosSubtitulo1' | translate }}</span>
        </h3>
        <h4 class="subTitulo subTitulo2">
          <img src="assets/icons/dibujo.png" alt="" class="iconosImgFav animated rollIn">
          <span>{{ 'app.dibujosSubtitulo2' | translate }}</span>
        </h4>
      </div>
    </div>
  </header>

  <!-- Botón Volver Superior -->
  <div class="fav-action-bar">
    <div></div> <!-- Espaciador -->
    <div class="divRight">
      <a class="btn-volver-pill animated zoomInDown" routerLink="/principal">
        <img src="assets/icons/flechaAtras.png" class="iconoFlecha">
        <span>{{ 'viaje.volver' | translate}}</span>
      </a>
    </div>
  </div>

  <!-- Para autenticarse en la aplicación -->
  <div *ngIf="authenticationService.isLoggedIn() === false" class="auth-box-container">
    <app-login></app-login>
  </div>

  <!-- Contenido protegido -->
  <div *ngIf="authenticationService.isLoggedIn()" class="fav-main-content">
    <ng-container *ngIf="vista$ | async as vista; else cargando">

      <!-- Buscador -->
      <div class="buscador-artistic-container">
        <app-buscador [placeholder]="'app.dibujosFiltrado' | translate" (buscar)="buscar($event)"></app-buscador>
      </div>

      <!-- Paginación superior compacta -->
      <div class="paginacion-container" *ngIf="vista.dibujos.length > maxSizeDisplay">
        <pagination-controls class="my-pagination compact-pagination" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]="maxSizeDisplay" (pageChange)="p = $event"></pagination-controls>
      </div>

      <!-- Grid tipo Columnas (Masonry) para respetar 100% las proporciones originales -->
      <div class="masonry-gallery-grid">
        <div *ngFor="let dibujo of vista.dibujos | paginate: { itemsPerPage: pageSize, currentPage: p }; let i = index" class="masonry-card-wrapper animated zoomInDown">
          <div class="gallery art-card">
            <a href="#" (click)="abierto = posicion(i); $event.preventDefault()">
              <div class="img-frame">
                <!-- Se eliminó el float y la clase responsive antigua para usar tamaño natural adaptable -->
                <img [src]="'assets/images/' + dibujo.src" loading="lazy" alt="">
                <div class="card-glass-overlay">
                  <span class="explore-pill">✨ Ver detalle</span>
                </div>
              </div>
              <figcaption class="textoFoto">
                <div class="badge-autor">
                  <b>{{dibujo.persona}}</b> ({{dibujo.anyo}})
                </div>
                <div class="info-text">
                  <span class="edad-badge">{{ dibujo.edad }} {{'app.edad' | translate}}</span>
                  <p>{{ dibujo.detalle | l10n }}</p>
                </div>
              </figcaption>
            </a>
          </div>
        </div>
      </div>

      <!-- Estado vacío -->
      <div class="centerText">
        <span *ngIf="vista.dibujos.length == 0" class="sin-resultados-box">
          📭 {{ 'app.sinResultados' | translate}}
        </span>
      </div>

      <!-- Paginación inferior compacta -->
      <div class="paginacion-container" *ngIf="vista.dibujos.length > maxSizeDisplay">
        <pagination-controls class="my-pagination compact-pagination" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]="maxSizeDisplay" (pageChange)="p = $event"></pagination-controls>
      </div>

      <!-- Visor Lightbox -->
      <app-lightbox *ngIf="abierto !== null" [fotos]="vista.fotos" [indice]="abierto" (cerrar)="(abierto = null)"></app-lightbox>
    </ng-container>

    <ng-template #cargando>
      <div class="spinner-container-creative">
        <div class="spinner-ring"></div>
        <span>{{ 'app.cargando' | translate}}</span>
      </div>
    </ng-template>
  </div> <!-- de la autenticacion -->

  <!-- Botón de vuelta inferior -->
  <div class="footer-back-wrapper">
    <a routerLink="/principal" class="btn-volver-pill">
      <img src="assets/icons/flechaAtras.png" loading="lazy" class="animated fadeIn iconoFlecha">
      <span>{{ 'viaje.volver' | translate}}</span>
    </a>
  </div>
</div>
