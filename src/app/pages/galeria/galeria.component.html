<section class="galeria">

  <header class="sec-head">
    <div class="sec-head__text">
      <h2 class="sec-title">{{ 'app.galeriaImagenes' | translate }}</h2>
      <p class="sec-sub">{{ 'app.subTituloGal' | translate }} {{ 'app.subTituloGal2' | translate }}</p>
    </div>
  </header>

  <ng-container *ngIf="fotos$ | async as fotos; else cargando">

    <div *ngIf="fotos.length > maxSizeDisplay">
      <pagination-controls id="gal" nextLabel="{{ 'app.siguiente' | translate }}" previousLabel="{{ 'app.anterior' | translate }}" [maxSize]="maxSizeDisplay" (pageChange)="p = $event"></pagination-controls>
    </div>

    <div class="masonry">
      <figure class="tile" *ngFor="let foto of fotos | paginate: { id: 'gal', itemsPerPage: pageSize, currentPage: p }; let i = index">
        <button type="button" class="tile__btn" (click)="fotoAbierta = posicion(i)">
          <img [src]="'assets/images/' + foto.src" loading="lazy" alt="">
        </button>
      </figure>
    </div>

    <div *ngIf="fotos.length > maxSizeDisplay">
      <pagination-controls id="gal" nextLabel="{{ 'app.siguiente' | translate }}" previousLabel="{{ 'app.anterior' | translate }}" [maxSize]="maxSizeDisplay" (pageChange)="p = $event"></pagination-controls>
    </div>

    <app-lightbox *ngIf="fotoAbierta !== null" [fotos]="fotos" [indice]="fotoAbierta" (cerrar)="fotoAbierta = null"></app-lightbox>
  </ng-container>

  <ng-template #cargando>
    <div class="loader" role="status">
      <span class="loader__ring"></span>
      <span>{{ 'app.cargando' | translate }}</span>
    </div>
  </ng-template>
</section>
