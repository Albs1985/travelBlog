<br>
<h2 class="titulo">
  <img src="assets/icons/galeria.png" alt="" class="iconosImg animated rollIn"> &nbsp;{{ 'app.galeriaImagenes' | translate }}
</h2>
<h3 class="subTitulo">
  <img src="assets/icons/viajarMundo.png" alt="" class="iconosImgFav animated rollIn">
 {{ 'app.subTituloGal' | translate }}
</h3>
<h4 class="subTitulo">
  {{ 'app.subTituloGal2' | translate }}
</h4>
<br>
<div class="divRight">
  <img src="assets/icons/flechaAtras.png" class="animated fadeIn iconoFlecha" routerLink="/principal"><a routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
</div>
<br>


<!-- Para autenticarse en la aplicación -->
<div *ngIf="authenticationService.isLoggedIn() === false">
  <br><br><br>
  <app-login></app-login>
  <br>
</div>


<div *ngIf="authenticationService.isLoggedIn()">
  <ng-container *ngIf="fotos$ | async as fotos; else cargando">
    <br>
    <div class="paginacion">
      <pagination-controls class="my-pagination" id="gal" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]=maxSizeDisplay (pageChange)="p = $event"></pagination-controls>
    </div>
    <div *ngFor="let foto of fotos | paginate: { id: 'gal', itemsPerPage: pageSize, currentPage: p }; let i = index" class="responsive animated zoomInDown">
      <div class="gallery">
        <a href="#" (click)="fotoAbierta = posicion(i); $event.preventDefault()">
          <img [src]="'assets/images/' + foto.src" loading="lazy" alt="" width="600" height="400">
        </a>
      </div>
    </div>
    <div class="paginacion">
      <pagination-controls class="my-pagination" id="gal" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]=maxSizeDisplay (pageChange)="p = $event"></pagination-controls>
    </div>
    <app-lightbox *ngIf="fotoAbierta !== null" [fotos]="fotos" [indice]="fotoAbierta" (cerrar)="fotoAbierta = null"></app-lightbox>
  </ng-container>
  <ng-template #cargando>
    <div class="spinner-container">
      <div class="spinner"></div>
      <span> &nbsp; {{ 'app.cargando' | translate}}</span>
    </div>
  </ng-template>
</div> <!-- de la autenticacion -->


<br>
<br>
<div class="divRight">
  <img src="assets/icons/flechaAtras.png" class="animated fadeIn iconoFlecha" routerLink="/principal"><a routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
</div>


<div class="clearfix"></div>
