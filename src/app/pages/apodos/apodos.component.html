<section class="apodos">
  <header class="sec-head">
    <div class="sec-head__text">
      <h2 class="sec-title">{{ 'app.apodosTitulo' | translate }}</h2>
      <p class="sec-sub">{{ 'app.apodosSubtitulo1' | translate }} {{ 'app.apodosSubtitulo2' | translate }}</p>
    </div>
  </header>

  <ul class="people" *ngIf="viajerosService.viajeros$ | async as viajeros">
    <li class="person" *ngFor="let viajero of viajeros; let i = index" [ngClass]="'tone-' + (i % 4)">

      <a class="person__photo" target="_blank" rel="noopener" [href]="viajero.fotoPerfil">
        <img [src]="viajero.fotoPerfil" [alt]="viajero.nombreCorto" loading="lazy">
      </a>

      <div class="person__main">
        <h3 class="person__name">{{ viajero.nombreCorto }}</h3>
        <span class="person__age">{{ viajero.edad }} {{ 'app.edad' | translate }}</span>
        <p class="person__info" *ngIf="viajero.info">{{ viajero.info | l10n }}</p>
      </div>

      <ul class="person__aka" *ngIf="viajero.aka && viajero.aka.length > 0">
        <li *ngFor="let apodo of viajero.aka; let j = index" [style.--rot]="((j % 3) - 1) * 2 + 'deg'">{{ apodo }}</li>
      </ul>
    </li>
  </ul>
</section>
