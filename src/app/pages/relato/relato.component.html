<ng-container *ngIf="vista$ | async as vista; else cargando">

  <!-- Aviso de relato no encontrado -->
  <div *ngIf="!esVista(vista)" class="aviso text-center py-5">
    <p class="mb-3">{{ 'app.sinResultados' | translate }}</p>
    <a routerLink="/principal" class="btn-volver-enlace d-inline-flex align-items-center gap-2 text-decoration-none">
      <img src="assets/icons/flechaAtras.png" class="iconoFlecha" alt="">
      <span>{{ 'app.listaViajes' | translate }}</span>
    </a>
  </div>

  <ng-container *ngIf="esVista(vista)">

    <!-- Pantalla de Autenticación -->
    <div *ngIf="!estaAutenticado(vista.relato)" class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 text-center py-4">
          <div class="mb-4">
            <img src="assets/icons/seguridad.png" alt="" class="iconSeguridad animated fadeIn pulse">
          </div>
          <div class="mb-4">
            <app-login></app-login>
          </div>
          <div class="mt-4">
            <a routerLink="/principal/" class="btn-volver-enlace d-inline-flex align-items-center gap-2 text-decoration-none">
              <img src="assets/icons/flechaAtras.png" class="animated fadeIn pulse iconoFlecha" alt="">
              <span>{{ 'app.listaViajes' | translate }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenido Autenticado -->
    <div *ngIf="estaAutenticado(vista.relato)" class="container-fluid px-2 px-md-4 py-3">
      <div class="row justify-content-center">
        <!-- 👈 Añadido mx-auto y col-md-10 para un centrado perfecto en PC y adaptación limpia en móvil -->
        <article class="col-12 col-md-10 col-lg-8 mx-auto px-3 px-md-4">

          <!-- Barra de Herramientas unificada -->
          <div class="mb-4">
            <app-toolbar
              [volverLink]="'/principal'"
              [mostrarBotonNuevo]="false"
              [mostrarBotonConfig]="true">
            </app-toolbar>
          </div>

          <!-- Cabecera del relato -->
          <div class="text-center mb-4">
            <span class="d-block text-uppercase text-muted fw-bold small tracking-wider mb-2" *ngIf="vista.relato.supra">
              {{ vista.relato.supra | l10n }}<ng-container *ngIf="vista.edad !== undefined"> ({{ vista.edad }} {{ 'app.edad' | translate }})</ng-container>
            </span>

            <div class="d-flex justify-content-center align-items-center gap-2 mb-3" *ngIf="vista.relato.icono">
              <img [src]="'assets/icons/' + vista.relato.icono" alt="" class="icon animated fadeIn" style="width: 32px; height: 32px;">
              <img src="assets/icons/relatos.png" alt="" class="icon animated fadeIn" style="width: 32px; height: 32px;">
            </div>

            <h2 class="fw-bold display-6 text-dark mb-2">
              {{ vista.relato.titulo | l10n }}
            </h2>

            <span class="text-muted small fst-italic" *ngIf="vista.relato.fecha">
              {{ vista.relato.fecha | l10n }}
            </span>
          </div>

          <!-- Portada opcional (Proporción original respetada) -->
          <figure *ngIf="vista.relato.portada as portada" class="animated zoomInDown my-4 text-center">
            <button type="button" class="foto-btn p-0 border-0 bg-transparent w-100" (click)="fotoAbierta = 0">
              <img [src]="'assets/images/' + portada.src" alt="" class="img-fluid rounded-4 shadow-sm">
            </button>
            <figcaption class="textoFoto text-muted small mt-2" *ngIf="portada.desc">{{ portada.desc | l10n }}</figcaption>
          </figure>

          <!-- Bloques de contenido dinámicos -->
          <div class="my-4">
            <app-bloques [bloques]="vista.bloques" [extra]="vista.extra" [mapa]="vista.relato.mapa" (abrir)="fotoAbierta = $event"></app-bloques>
          </div>

          <!-- Enlace al siguiente viaje / relato -->
          <!-- <div class="d-flex justify-content-between align-items-center my-5 pt-4 border-top" *ngIf="vista.relato.siguiente">
            <a routerLink="/principal/" class="btn-volver-enlace d-inline-flex align-items-center gap-2 text-decoration-none">
              <img src="assets/icons/flechaAtras.png" class="iconoFlecha animated fadeIn pulse" alt="">
              <span>{{ 'app.listaViajes' | translate }}</span>
            </a>

            <a [routerLink]="['/viaje', vista.relato.siguiente]" class="btn-siguiente-enlace d-inline-flex align-items-center gap-2 text-decoration-none fw-bold text-warning">
              <span>{{ 'viaje.empezar' | translate }}</span>
              <img src="assets/icons/flechaDer.png" class="iconoFlecha animated fadeIn pulse" alt="">
            </a>
          </div> -->

        </article>
      </div>

      <app-lightbox *ngIf="fotoAbierta !== null" [fotos]="vista.galeria" [indice]="fotoAbierta" (cerrar)="fotoAbierta = null"></app-lightbox>
    </div>
  </ng-container>
</ng-container>

<ng-template #cargando>
  <div class="spinner-container d-flex justify-content-center align-items-center py-5">
    <div class="spinner"></div>
    <span class="ms-2"> &nbsp; {{ 'app.cargando' | translate }}</span>
  </div>
</ng-template>
