<br>
<h2 class="titulo">
    <img src="assets/icons/estrella.png" alt="" class="iconosImgFav animated rollIn">
   {{ 'app.galeriaImagenesFav' | translate }}
</h2>
<h3 class="subTitulo">
    <img src="assets/icons/iconoFamiliar.png" alt="" class="iconosImgFav animated rollIn">
   {{ 'app.subTituloFav' | translate }}
</h3>
<h4 class="subTitulo">
    {{ 'app.subTituloFav2' | translate }}
</h4>
<br>
<div class="tituloOrdenar">
  <button *ngIf="!orderDesc" class="botonOrdenar animated zoomInDown" (click)="ordenar()"><img src="assets/icons/flechaAbajo.png" class="iconoFlecha"> {{ 'app.ordenarPorAnyo' | translate }}</button>
  <button *ngIf="orderDesc" class="botonOrdenar animated zoomInDown" (click)="ordenar()"><img src="assets/icons/flechaArriba.png" class="iconoFlecha"> {{ 'app.ordenarPorAnyo' | translate }}</button>
  <div class="divRight">
    <img src="assets/icons/flechaAtras.png" class="animated zoomInDown iconoFlecha" routerLink="/principal"><a class="animated zoomInDown" routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
  </div>
</div>

<!-- Para autenticarse en la aplicación -->
<div *ngIf="authenticationService.isLoggedIn() === false">
  <br><br><br>
  <app-login></app-login>
  <br>
</div>


<div *ngIf="authenticationService.isLoggedIn()">
  <br>
  <div class="row fotosPerfiles">
    <div *ngFor="let viajero of viajerosService.viajeros$ | async" class="row dobleFotos">
      <figure>
        <a target="_blank" rel="noopener" [href]="viajero.fotoPerfil"><img [src]="viajero.fotoPerfil" [alt]="viajero.nombreCorto" class="img-responsive"></a>
        <figcaption>{{viajero.nombreCompleto}} </figcaption>
        <figcaption>({{viajero.edad}} {{ 'app.edad' | translate}})</figcaption>
      </figure>
    </div>
  </div>
  <br>
  <app-buscador [placeholder]="'favoritos.filtrado' | translate" [sinMargenSuperior]="true" (buscar)="buscar($event)"></app-buscador>
  <ng-container *ngIf="vista$ | async as vista; else cargando">
    <br>
    <div class="paginacion">
      <pagination-controls *ngIf="vista.fotos.length > maxSizeDisplay" class="my-pagination" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]=maxSizeDisplay (pageChange)="p = $event"></pagination-controls>
    </div>
    <div *ngFor="let foto of vista.fotos | paginate: { itemsPerPage: pageSize, currentPage: p }; let i = index" class="responsive animated zoomInDown">
      <div class="gallery">
        <a href="#" (click)="abierta = posicion(i); $event.preventDefault()">
          <img [src]="'assets/images/' + foto.src" loading="lazy" alt="" width="600" height="400">
          <figcaption class="textoFoto"><b>{{foto.anyo}}</b>, {{foto.lugar}}. {{ foto.desc | l10n }}</figcaption>
        </a>
      </div>
    </div>
    <div class="centerText">
      <span *ngIf="vista.fotos.length == 0"> {{ 'app.sinResultados' | translate}}</span>
    </div>
    <div class="clearfix"></div>
    <br>
    <br>
    <div class="paginacion">
      <pagination-controls *ngIf="vista.fotos.length > maxSizeDisplay" class="my-pagination" nextLabel="{{ 'app.siguiente' | translate}}" previousLabel="{{ 'app.anterior' | translate}}" [maxSize]=maxSizeDisplay (pageChange)="p = $event"></pagination-controls>
    </div>
    <app-lightbox *ngIf="abierta !== null" [fotos]="vista.visor" [indice]="abierta" (cerrar)="abierta = null"></app-lightbox>
  </ng-container>
  <ng-template #cargando>
    <div class="spinner-container">
      <div class="spinner"></div>
      <span> &nbsp; {{ 'app.cargando' | translate}}</span>
    </div>
  </ng-template>
</div> <!-- de la autenticacion -->
<br>
<br>
<div class="divRight">
  <img src="assets/icons/flechaAtras.png" loading="lazy" class="animated fadeIn iconoFlecha" routerLink="/principal"><a routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
</div>
