<section class="fav">

  <header class="sec-head">
    <div class="sec-head__text">
      <h2 class="sec-title">{{ 'app.galeriaImagenesFav' | translate }}</h2>
      <p class="sec-sub">{{ 'app.subTituloFav' | translate }} {{ 'app.subTituloFav2' | translate }}</p>
    </div>
    <app-toolbar
      [volverLink]="''"
      [mostrarBotonOrdenar]="true"
      [orderDesc]="orderDesc"
      [textoNuevo]="'app.nuevoFavorito'"
      [mostrarBotonSeleccionMultiple]="true"
      [modoSeleccionMultiple]="modoSeleccionMultiple"
      [cantidadSeleccionada]="seleccionadasParaBorrar.size"
      (ordenar)="ordenar()"
      (nuevo)="mostrarFormulario = true"
      (toggleSeleccionMultiple)="modoSeleccionMultiple = !modoSeleccionMultiple; seleccionadasParaBorrar.clear()"
      (confirmarBorradoMultiple)="eliminarSeleccionadas()">
    </app-toolbar>
  </header>

  <!-- Alta por lotes -->
  <div *ngIf="mostrarFormulario" class="modal" (click)="mostrarFormulario = false; fotosPendientes = []">
    <div class="modal__card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="modal__grab" aria-hidden="true"></div>
      <div class="modal__head">
        <h3 class="modal__title">{{ 'app.nuevoFavorito' | translate }}</h3>
        <button type="button" class="round-btn" (click)="mostrarFormulario = false; fotosPendientes = []" [attr.aria-label]="'app.cerrar' | translate">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <label class="field">
        <span class="field__label">{{ 'app.seleccionarFotos' | translate }}</span>
        <input type="file" class="field__input" (change)="onFilesSelected($event)" multiple accept="image/*">
      </label>

      <div class="batch" *ngIf="fotosPendientes.length > 0">
        <div class="batch__item" *ngFor="let item of fotosPendientes; let i = index">
          <div class="batch__thumb"><img [src]="item.previewUrl" alt=""></div>
          <div class="batch__fields">
            <input type="text" class="field__input" [(ngModel)]="item.anyo" [placeholder]="'app.anyoPlaceholder' | translate">
            <input type="text" class="field__input" [(ngModel)]="item.lugar" [placeholder]="'app.lugarPlaceholder' | translate">
            <input type="text" class="field__input" [(ngModel)]="item.etiquetas" [placeholder]="'app.etiquetasPlaceholder' | translate">
            <input type="text" class="field__input" [(ngModel)]="item.personasStr" [placeholder]="'app.personasPlaceholder' | translate">
            <textarea class="field__input" rows="2" [(ngModel)]="item.desc" [placeholder]="'app.descPlaceholder' | translate"></textarea>
          </div>
          <button type="button" class="round-btn" (click)="quitarPendiente(i)" [attr.title]="'app.quitar' | translate" [attr.aria-label]="'app.quitar' | translate">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>

      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" (click)="mostrarFormulario = false; fotosPendientes = []">{{ 'app.cancelar' | translate }}</button>
        <button type="button" class="btn" (click)="guardarTodos()" [disabled]="cargandoAccion || fotosPendientes.length === 0">
          {{ cargandoAccion ? ('app.guardando' | translate) : (('app.guardarLote' | translate) + ' (' + fotosPendientes.length + ')') }}
        </button>
      </div>
    </div>
  </div>

  <div class="fav__search">
    <app-buscador [placeholder]="'favoritos.filtrado' | translate" [sinMargenSuperior]="true" (buscar)="(buscar($event))"></app-buscador>
  </div>

  <ng-container *ngIf="vista$ | async as vista; else cargando">

    <div *ngIf="vista.fotos.length > maxSizeDisplay">
      <pagination-controls nextLabel="{{ 'app.siguiente' | translate }}" previousLabel="{{ 'app.anterior' | translate }}" [maxSize]="maxSizeDisplay" (pageChange)="p = $event"></pagination-controls>
    </div>

    <div class="masonry">
      <figure class="tile" *ngFor="let foto of vista.fotos | paginate: { itemsPerPage: pageSize, currentPage: p }; let i = index" [class.tile--busy]="idsEliminando.has(foto.src)">

        <button type="button" class="tile__btn" (click)="!idsEliminando.has(foto.src) && (abierta = posicion(i))">
          <img [src]="'assets/images/' + foto.src" loading="lazy" alt="">
        </button>

        <input *ngIf="modoSeleccionMultiple" type="checkbox" class="tile__check" [checked]="seleccionadasParaBorrar.has(foto.src)" (change)="toggleSeleccion(foto.src)">

        <div class="tile__busy" *ngIf="idsEliminando.has(foto.src)">
          <span class="loader__ring"></span>
          <span>{{ 'app.eliminando' | translate }}</span>
        </div>

        <figcaption class="tile__caption">
          <span class="pill pill--terra">{{ foto.anyo }}</span>
          <strong class="tile__place" *ngIf="foto.lugar">{{ foto.lugar }}</strong>
          <p class="tile__desc" *ngIf="foto.desc">{{ foto.desc }}</p>
          <button *ngIf="(this.authenticationService.tokenGithubValidoSubject$ | async) === true && !modoSeleccionMultiple" type="button" class="btn btn--sm btn--soft tile__del"
                  [disabled]="idsEliminando.has(foto.src)" (click)="eliminar(foto.src, $event)">
            {{ 'app.eliminarBtn' | translate }}
          </button>
        </figcaption>
      </figure>
    </div>

    <div class="empty-note" *ngIf="vista.fotos.length == 0">{{ 'app.sinResultados' | translate }}</div>

    <div *ngIf="vista.fotos.length > maxSizeDisplay">
      <pagination-controls nextLabel="{{ 'app.siguiente' | translate }}" previousLabel="{{ 'app.anterior' | translate }}" [maxSize]="maxSizeDisplay" (pageChange)="p = $event"></pagination-controls>
    </div>

    <app-lightbox *ngIf="abierta !== null" [fotos]="vista.visor" [indice]="abierta" (cerrar)="abierta = null"></app-lightbox>
  </ng-container>

  <ng-template #cargando>
    <div class="loader" role="status">
      <span class="loader__ring"></span>
      <span>{{ 'app.cargando' | translate }}</span>
    </div>
  </ng-template>
</section>
