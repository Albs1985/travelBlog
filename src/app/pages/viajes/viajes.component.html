<header class="page-head">
  <a class="round-btn" routerLink="/principal" [attr.aria-label]="'app.home' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </a>
  <div class="page-head__text">
    <h1 class="page-head__title">{{ 'header.mensajeCabeceraAnyos' | translate }}</h1>
  </div>
  <button type="button" class="round-btn sort" [class.is-asc]="!orderDesc" (click)="ordenar()"
          [attr.aria-label]="'app.ordenarPorAnyo' | translate" [attr.title]="'app.ordenarPorAnyo' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M8 20l-3-3M8 20l3-3M16 20V4M16 4l-3 3M16 4l3 3"/></svg>
  </button>
</header>

<ng-container *ngIf="anyos$ | async as anyos; else cargando">
  <p class="notice" *ngIf="(servicioViajes.error$ | async) === true">{{ 'app.errorCarga' | translate }}</p>

  <ul class="years">
    <li class="years__item" *ngFor="let a of ordenados(anyos)">
      <a class="year-card" [routerLink]="['/viajesFiltrados', a.anyo]">
        <img *ngIf="a.portada" class="year-card__img" [src]="'assets/images/' + a.portada" [alt]="'' + a.anyo" loading="lazy">
        <span class="year-card__year">{{ a.anyo }}</span>
        <span class="year-card__places">
          <span *ngFor="let destino of a.destinos; let last = last">{{ destino }}{{ last ? '' : ', ' }}</span>
        </span>
      </a>
    </li>
  </ul>
</ng-container>

<!-- Mapa de los viajes -->
<section class="map-section">
  <h2 class="section-title">{{ 'app.mapa' | translate }}</h2>
  <app-map></app-map>
</section>

<ng-template #cargando>
  <div class="loader" role="status">
    <span class="loader__ring"></span>
    <span>{{ 'app.cargando' | translate }}</span>
  </div>
</ng-template>
