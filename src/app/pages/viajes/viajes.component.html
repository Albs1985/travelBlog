<div class="divRight3">
  <img src="assets/icons/flechaAtras.png" class="animated zoomInDown iconoFlecha" routerLink="/principal"><a routerLink="/principal"  class="animated zoomInDown">{{ 'viaje.volver' | translate}}</a>
</div>
<div class="tituloOrdenar">
  <button class="botonOrdenar animated zoomInDown" (click)="ordenar()">
    <img [src]="orderDesc ? 'assets/icons/flechaArriba.png' : 'assets/icons/flechaAbajo.png'" alt="" class="iconoFlecha"> {{ 'app.ordenar' | translate }}
  </button>
  <h2 class="fh5co-article-title subtitulo animated fadeIn">
      <a>{{ 'header.mensajeCabeceraAnyos' | translate }}
          <img src="assets/icons/viajes.png" alt="" class="iconosImg4 animated rollIn">
      </a>
  </h2>
</div>

<!-- Para autenticarse en la aplicación -->
<div *ngIf="authenticationService.isLoggedIn() === false">
  <br>
  <app-login></app-login>
  <br>
</div>

<div *ngIf="authenticationService.isLoggedIn()">
  <ng-container *ngIf="anyos$ | async as anyos; else cargando">
    <div *ngIf="(servicioViajes.error$ | async) === true" class="aviso">{{ 'app.errorCarga' | translate }}</div>
    <div class="row fh5co-post-entry">
      <div *ngFor="let a of ordenados(anyos)">
        <article class="bloqueAnyo">
          <span [routerLink]="['/viajesFiltrados', a.anyo]" class="fh5co-meta fh5co-date">{{ a.anyo }}</span>
          <div class="contenedor-imagen">
              <a [routerLink]="['/viajesFiltrados', a.anyo]">
                <img *ngIf="a.portada" [src]="'assets/images/' + a.portada" [alt]="'' + a.anyo" class="img-responsive" loading="lazy">
              </a>
              <div [routerLink]="['/viajesFiltrados', a.anyo]" class="textoEnImagen img-responsiveAnyo">{{ a.anyo }}
                  <img src="assets/icons/flechaDer.png" alt="" class="animated fadeIn pulse iconoFlechaPeque" [routerLink]="['/viajesFiltrados', a.anyo]">
              </div>
          </div>
          <div *ngFor="let destino of a.destinos">
              <h2 class="fh5co-article-title"><a [routerLink]="['/viajesFiltrados', a.anyo]">{{ destino }}</a></h2>
          </div>
        </article>
      </div>
    </div>
  </ng-container>
  <ng-template #cargando>
    <div class="spinner-container">
      <div class="spinner"></div>
      <span> &nbsp; {{ 'app.cargando' | translate }}</span>
    </div>
  </ng-template>
</div> <!-- de la autenticacion -->
<br>
<div class="divRight3">
  <img src="assets/icons/flechaAtras.png" class="animated zoomInDown iconoFlecha" routerLink="/principal"><a routerLink="/principal">{{ 'viaje.volver' | translate}}</a>
</div>
