<div class="cuerpo" *ngIf="paginas.length">
  <div class="book">
    <input class="input" type="checkbox" *ngFor="let p of paginas; let i = index" [id]="'c' + (i + 1)">
    <div id="cover"></div>
    <div class="flip-book">
      <div class="flip" *ngFor="let pagina of paginas; let i = index" [id]="'p' + (i + 1)">
        <div class="back"></div>
        <div class="front">
          <ng-container *ngIf="i === 0">
            <h2 *ngIf="titulo">{{ titulo | l10n }}</h2>
            <h4 *ngIf="subtitulo">{{ subtitulo | l10n }}</h4>
          </ng-container>
          <ng-container *ngFor="let t of pagina">
            <h3 *ngIf="t.tipo === 'titulo' || t.tipo === 'subtitulo'">{{ t.texto | l10n }}</h3>
            <p *ngIf="t.tipo !== 'titulo' && t.tipo !== 'subtitulo'" class="p">{{ t.texto | l10n }}</p>
          </ng-container>
          <div>
            <label *ngIf="i > 0" [attr.for]="'c' + i" class="back-btn"><img src="assets/icons/flechaIzq.png" alt="" class="barraPaginas iconoFlecha"></label>
            <label [attr.for]="'c' + (i + 1)" class="next-btn"><img src="assets/icons/flechaDer.png" alt="" class="iconoFlecha"></label>
          </div>
        </div>
      </div>

      <!-- Contraportada -->
      <div class="flip" [id]="'p' + (paginas.length + 1)">
        <div class="back"></div>
        <div class="front">
          <label [attr.for]="'c' + paginas.length" class="back-btn"><img src="assets/icons/flechaIzq.png" alt="" class="barraPaginas iconoFlecha"></label>
        </div>
      </div>
    </div>
  </div>
</div>
