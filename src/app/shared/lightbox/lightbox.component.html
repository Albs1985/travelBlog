<div class="lb" role="dialog" aria-modal="true" (click)="cerrar.emit()">

  <button type="button" class="lb__btn lb__close" (click)="cerrar.emit()" [attr.aria-label]="'app.cerrar' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>

  <button *ngIf="fotos.length > 1" type="button" class="lb__btn lb__prev" (click)="ir(-1, $event)" [attr.aria-label]="'app.anterior' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </button>

  <figure *ngIf="actual as foto" class="lb__fig" (click)="$event.stopPropagation()" (touchstart)="tocarInicio($event)" (touchend)="tocarFin($event)">
    <img class="lb__img" [src]="'assets/images/' + foto.src" [alt]="foto.desc | l10n">
    <figcaption class="lb__caption" *ngIf="(foto.desc | l10n) || fotos.length > 1">
      <span class="lb__text" *ngIf="foto.desc | l10n">{{ foto.desc | l10n }}</span>
      <span class="lb__count" *ngIf="fotos.length > 1">{{ indice + 1 }} / {{ fotos.length }}</span>
    </figcaption>
  </figure>

  <button *ngIf="fotos.length > 1" type="button" class="lb__btn lb__next" (click)="ir(1, $event)" [attr.aria-label]="'app.siguiente' | translate">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
  </button>
</div>
