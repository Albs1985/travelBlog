<div class="story">
  <ng-container *ngFor="let b of bloques" [ngSwitch]="b.tipo">

    <h2 *ngSwitchCase="'titulo'" class="story__title">{{ b.texto | l10n }}</h2>

    <h3 *ngSwitchCase="'subtitulo'" class="story__subtitle">{{ b.texto | l10n }}</h3>

    <p *ngSwitchCase="'parrafo'" class="story__text">{{ b.texto | l10n }}</p>

    <aside *ngSwitchCase="'nota'" class="story__note">
      <span class="story__note-label">{{ 'viaje.destacado' | translate }}</span>
      {{ b.texto | l10n }}
    </aside>

    <blockquote *ngSwitchCase="'cita'" class="story__quote">
      <p>{{ b.texto | l10n }}</p>
      <cite *ngIf="b.autor">{{ b.autor | l10n }}</cite>
    </blockquote>

    <div *ngSwitchCase="'lista'" class="story__list">
      <h4 *ngIf="b.titulo" class="story__list-title">{{ b.titulo | l10n }}</h4>
      <ul>
        <li *ngFor="let item of b.items">{{ item | l10n }}</li>
      </ul>
    </div>

    <div *ngSwitchCase="'mapa'" class="story__map">
      <iframe [src]="mapa | safe" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div *ngSwitchCase="'fotos'" class="photos" [class.photos--one]="b.fotos?.length === 1">
      <figure class="photo" *ngFor="let f of b.fotos; let i = index">
        <button type="button" class="photo__btn" (click)="abrir.emit(f.idx)">
          <img
            [src]="'assets/images/' + f.foto.src"
            [alt]="f.foto.desc ? (f.foto.desc | l10n) : alt"
            loading="eager"
            [attr.decoding]="i === 0 ? 'sync' : 'async'"
            [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
            (error)="ocultar($event)">
        </button>
        <figcaption class="photo__caption" *ngIf="f.foto.desc">{{ f.foto.desc | l10n }}</figcaption>
      </figure>
    </div>

  </ng-container>

  <ng-container *ngIf="extra.length">
    <h3 class="story__title">{{ 'viaje.masFotos' | translate }}</h3>
    <div class="photos">
      <figure class="photo" *ngFor="let f of extra; let i = index">
        <button type="button" class="photo__btn" (click)="abrir.emit(f.idx)">
          <img
            [src]="'assets/images/' + f.foto.src"
            [alt]="alt"
            loading="eager"
            [attr.decoding]="i === 0 ? 'sync' : 'async'"
            (error)="ocultar($event)">
        </button>
      </figure>
    </div>
  </ng-container>
</div>
