<header class="topbar">
  <a class="brand" routerLink="/principal" [attr.aria-label]="'nav.irInicio' | translate">
    <svg class="logo-mark brand__mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="logo-mark__sun" cx="16" cy="12" r="5.5"/><path class="logo-mark__wave" d="M3 20.5c3.2 0 3.2-2.2 6.4-2.2s3.2 2.2 6.6 2.2 3.2-2.2 6.4-2.2 3.2 2.2 6.6 2.2"/><path class="logo-mark__wave" d="M3 26c3.2 0 3.2-2.2 6.4-2.2s3.2 2.2 6.6 2.2 3.2-2.2 6.4-2.2 3.2 2.2 6.6 2.2"/></svg>
    <span class="brand__text">
      <span class="brand__name">{{ 'app.familia' | translate }}</span>
      <span class="brand__sub">Serrador Casares</span>
    </span>
  </a>

  <div class="actions">
    <!-- Idioma -->
    <div class="lang" role="group" [attr.aria-label]="'app.idioma' | translate">
      <ng-container *ngIf="(commonService.sinIdioma$ | async) === true; else idiomasLibres">
        <button type="button" class="lang__btn" disabled [attr.title]="'app.valenciano' | translate">VAL</button>
        <button type="button" class="lang__btn is-active" disabled [attr.title]="'app.spanish' | translate">ES</button>
      </ng-container>
      <ng-template #idiomasLibres>
        <button type="button" class="lang__btn"
                [class.is-active]="isSelectedValenciano"
                [attr.aria-pressed]="isSelectedValenciano"
                [attr.title]="'app.valenciano' | translate"
                (click)="changeLanguageToValenciano()">VAL</button>
        <button type="button" class="lang__btn"
                [class.is-active]="isSelectedSpanish"
                [attr.aria-pressed]="isSelectedSpanish"
                [attr.title]="'app.spanish' | translate"
                (click)="changeLanguageToSpanish()">ES</button>
      </ng-template>
    </div>

    <!-- Buscar -->
    <button type="button" class="icon-btn icon-btn--search" (click)="buscador.showModal()"
            [attr.aria-label]="'header.buscarViajes' | translate">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <span class="icon-btn__label">{{ 'header.buscarViajes' | translate }}</span>
    </button>

    <!-- Más opciones (solo móvil y tablet; en escritorio están en la barra lateral) -->
    <!-- <button type="button" class="icon-btn icon-btn--more" (click)="menu.showModal()"
            [attr.aria-label]="'nav.masOpciones' | translate">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>
    </button> -->
  </div>
</header>

<!-- Hoja de búsqueda -->
<dialog #buscador class="sheet" aria-labelledby="buscador-titulo"
        (click)="$event.target === buscador && buscador.close()">
  <div class="sheet__inner">
    <div class="sheet__grab" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="buscador-titulo">{{ 'header.buscarViajes' | translate }}</h2>
      <button type="button" class="icon-btn" (click)="buscador.close()" [attr.aria-label]="'app.cerrar' | translate">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <form id="busquedaForm" class="search" (submit)="$event.preventDefault(); buscar(); caja.value && buscador.close()">
      <input #caja id="myInput" class="search__input" type="search" autocomplete="off" enterkeyhint="search"
             [placeholder]="'header.palabra' | translate" autofocus>
      <button type="submit" class="search__go" [attr.aria-label]="'header.buscar' | translate">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </button>
    </form>

    <p class="sheet__label">{{ 'header.categoria' | translate }}</p>
    <div class="cats">
      <a class="chip" routerLink="/viajesFiltrados/playa" (click)="buscador.close()">{{ 'header.playa' | translate }}</a>
      <a class="chip" routerLink="/viajesFiltrados/montanya" (click)="buscador.close()">{{ 'header.montanya' | translate }}</a>
      <a class="chip" routerLink="/viajesFiltrados/ciudad" (click)="buscador.close()">{{ 'header.ciudad' | translate }}</a>
      <a class="chip" routerLink="/viajesFiltrados/nieve" (click)="buscador.close()">{{ 'header.nieve' | translate }}</a>
    </div>
  </div>
</dialog>
