name: Notificar familia push

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipus de novetat'
        type: choice
        required: true
        default: 'fotos'
        options:
          - frase
          - fotos
          - dibujo
          - favorito
          - viaje
          - relato
      titulo:
        description: 'Título o resumen de la novedad'
        required: true
        default: 'Actualización familiar'

permissions:
  contents: write

jobs:
  enviar-notificaciones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Enviar notificaciones push
        env:
          TIPO_NOVEDAD: ${{ inputs.tipo }}
          TITULO_NOVEDAD: ${{ inputs.titulo }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/enviar-push.mjs

      - name: Guardar limpieza de suscripciones caducadas si hubo cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios en suscripciones"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/assets/push-subscriptions.json src/assets/push-subscriptions.json
            git commit -m "chore(push): limpiar suscripciones caducadas"
            git push
          fi
