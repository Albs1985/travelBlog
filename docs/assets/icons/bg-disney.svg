<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyMagic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="55%" stop-color="#fbc2eb" />
      <stop offset="100%" stop-color="#ffecd2" />
    </linearGradient>
    <linearGradient id="castleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e7cc3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#b4a7d6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Cielo degradado -->
  <rect width="440" height="800" fill="url(#skyMagic)" />

  <!-- Estrellas y destellos -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="65" cy="90" r="2.5" />
    <circle cx="370" cy="70" r="3" />
    <circle cx="140" cy="180" r="2" />
    <circle cx="310" cy="160" r="2.5" />
    <circle cx="80" cy="300" r="2" />
    <circle cx="390" cy="280" r="3" />
    <path d="M220 60 L223 70 L233 73 L223 76 L220 86 L217 76 L207 73 L217 70 Z" />
    <path d="M95 140 L97 146 L103 148 L97 150 L95 156 L93 150 L87 148 L93 146 Z" />
    <path d="M340 210 L342 216 L348 218 L342 220 L340 226 L338 220 L332 218 L338 216 Z" />
  </g>

  <!-- Nubes suaves -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="60" cy="240" r="45" />
    <circle cx="105" cy="245" r="35" />
    <circle cx="20" cy="250" r="30" />

    <circle cx="360" cy="340" r="50" />
    <circle cx="410" cy="350" r="40" />
    <circle cx="315" cy="355" r="30" />
  </g>

  <!-- Silueta de Castillo Mágico al fondo -->
  <g fill="url(#castleGrad)">
    <!-- Base -->
    <rect x="120" y="620" width="200" height="180" />
    <!-- Torre Central -->
    <rect x="195" y="490" width="50" height="130" />
    <polygon points="190,490 220,420 250,490" />
    <!-- Torres Medias -->
    <rect x="150" y="540" width="35" height="80" />
    <polygon points="146,540 167.5,485 189,540" />
    <rect x="255" y="540" width="35" height="80" />
    <polygon points="251,540 272.5,485 294,540" />
    <!-- Torres Laterales -->
    <rect x="110" y="580" width="28" height="220" />
    <polygon points="106,580 124,535 142,580" />
    <rect x="302" y="580" width="28" height="220" />
    <polygon points="298,580 316,535 334,580" />
  </g>

  <!-- Colinas inferiores -->
  <path d="M0 710 Q140 660 280 720 T440 700 L440 800 L0 800 Z" fill="#d8b4e2" opacity="0.5" />
  <path d="M0 740 Q180 770 440 720 L440 800 L0 800 Z" fill="#c39bd3" opacity="0.6" />
</svg>